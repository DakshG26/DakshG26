<svg xmlns="http://www.w3.org/2000/svg" width="440" height="215" viewBox="0 0 440 215" role="img" aria-label="itantra-web">
  <defs>
    <linearGradient id="bg_card_itantra_web_light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="bar_card_itantra_web_light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <clipPath id="card_clip_card_itantra_web_light">
      <rect x="0.5" y="0.5" width="439" height="214" rx="14"/>
    </clipPath>
  </defs>

  <!-- Card Shell -->
  <rect x="0.5" y="0.5" width="439" height="214" rx="14" fill="url(#bg_card_itantra_web_light)" stroke="#D0D7DE" stroke-width="1"/>
  <g clip-path="url(#card_clip_card_itantra_web_light)">
    <!-- Top Accent Stripe -->
    <rect x="0" y="0" width="440" height="4" fill="url(#bar_card_itantra_web_light)"/>
    <!-- Subtle Pastel Glow Orb clipped inside card -->
    <circle cx="406" cy="28" r="56" fill="#10B981" opacity="0.07"/>
  </g>

  <!-- Repo Dot + Title -->
  <circle cx="31" cy="36" r="5" fill="#059669"/>
  <text x="45" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.3">itantra-web</text>

  <!-- Category Pill -->
  <rect x="300" y="23" width="116" height="22" rx="11" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
  <text x="358.2" y="37.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#047857" letter-spacing="0.5">ISRO SIH26173</text>

  <!-- Description -->
  <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569">24 bps neural semantic speech transceiver web</text>
  <text x="24" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569">app achieving 2,666x bandwidth compression</text>
  <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#475569">with 369 ms end-to-end WebRTC voice latency.</text>

  <!-- Tech Tags -->
  <rect x="24" y="136" width="58" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/><text x="53.0" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#334155">React</text><rect x="90.0" y="136" width="73" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/><text x="126.6" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#334155">FastAPI</text><rect x="171.2" y="136" width="66" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/><text x="204.0" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#334155">WebRTC</text><rect x="244.79999999999998" y="136" width="73" height="24" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/><text x="281.4" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#334155">Whisper</text>

  <!-- Divider & Bottom Metric -->
  <line x1="24" y1="176" x2="416" y2="176" stroke="#E2E8F0" stroke-width="1"/>
  <text x="24" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" fill="#64748B">Live Demo · itantra-isro.vercel.app</text>
  <text x="416" y="197" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#059669">View Repo →</text>
</svg>
