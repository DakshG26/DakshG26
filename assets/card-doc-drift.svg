<svg xmlns="http://www.w3.org/2000/svg" width="440" height="215" viewBox="0 0 440 215" role="img" aria-label="doc-drift">
  <defs>
    <linearGradient id="bg_card_doc_drift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1321"/>
      <stop offset="100%" stop-color="#11192C"/>
    </linearGradient>
    <linearGradient id="bar_card_doc_drift" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <!-- Card Shell -->
  <rect x="0.5" y="0.5" width="439" height="214" rx="14" fill="url(#bg_card_doc_drift)" stroke="#243044" stroke-width="1"/>
  <!-- Top Accent Stripe (clipped nicely via inset pill) -->
  <rect x="20" y="1" width="400" height="3" rx="1.5" fill="url(#bar_card_doc_drift)" opacity="0.9"/>

  <!-- Subtle Glow Orb -->
  <circle cx="400" cy="36" r="56" fill="#818CF8" opacity="0.06"/>

  <!-- Repo Icon + Title -->
  <circle cx="31" cy="36" r="5" fill="#818CF8"/>
  <text x="45" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC" letter-spacing="-0.3">doc-drift</text>

  <!-- Category Pill -->
  <rect x="322" y="23" width="94" height="22" rx="11" fill="#818CF8" fill-opacity="0.14" stroke="#818CF8" stroke-opacity="0.45" stroke-width="1"/>
  <text x="369.0" y="37.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" font-weight="700" fill="#818CF8" letter-spacing="0.5">AI TOOLING</text>

  <!-- Description (3 clean lines) -->
  <text x="24" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#94A3B8">Automated PR documentation drift detector</text>
  <text x="24" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#94A3B8">combining AST diffing, MiniLM embeddings, and</text>
  <text x="24" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#94A3B8">local Ollama LLMs to pinpoint stale docs.</text>

  <!-- Tech Tags -->
  <rect x="24" y="136" width="66" height="24" rx="6" fill="#161F30" stroke="#263349" stroke-width="1"/><text x="56.8" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#CBD5E1">Python</text><rect x="97.6" y="136" width="54" height="24" rx="6" fill="#161F30" stroke="#263349" stroke-width="1"/><text x="124.6" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#CBD5E1">AST</text><rect x="159.6" y="136" width="66" height="24" rx="6" fill="#161F30" stroke="#263349" stroke-width="1"/><text x="192.4" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#CBD5E1">Ollama</text><rect x="233.2" y="136" width="58" height="24" rx="6" fill="#161F30" stroke="#263349" stroke-width="1"/><text x="262.2" y="152" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" fill="#CBD5E1">CI/CD</text>

  <!-- Divider & Bottom Metric -->
  <line x1="24" y1="176" x2="416" y2="176" stroke="#1E293B" stroke-width="1"/>
  <text x="24" y="197" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" fill="#64748B">Line-Exact Citations · GitHub Actions</text>
  <text x="416" y="197" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#818CF8">View Repo →</text>
</svg>
